# https://lychee.cli.rs/usage/config/

# Most club and campus links are hosted by the OCF on one shared server. When the
# crawl sends many requests at once, that server drops some connections, and the
# links were reported as timeouts even though they load fine in a browser. A
# lower concurrency limit, a longer timeout, and patient retries avoid this.
max_concurrency = 2
timeout = 30
max_retries = 3
retry_wait_time = 10

# 401 means the page exists but needs a login. Council forms, Drive folders, and
# the calendar are restricted to Berkeley accounts, so Google answers a
# signed-out crawler with 401 even though the link works for students. A deleted
# form or file still returns 404 and is reported.
accept = ["100..=103", "200..=299", "401", "403", "429"]

# Social sites block crawlers; mail links can't be verified.
exclude = [
  "^https?://(www\\.)?(facebook|instagram|linkedin|twitter|x)\\.com",
  "^mailto:",
  "^tel:",
]
exclude_path = ["node_modules"]
user_agent = "Mozilla/5.0 (compatible; ESC-link-checker; +https://esc.studentorg.berkeley.edu)"
