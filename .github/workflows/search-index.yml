name: Rebuild search index

# Keeps assets/search/index.json in sync with the site's HTML so nobody has
# to remember to run `npm run build:search` after editing a page.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/js/top-bar.js'
      - 'assets/js/bottom-bar.js'
      - 'data/search/**'
      - 'scripts/build-search-index.mjs'
      - 'scripts/lib/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:search
      - name: Commit if the index changed
        run: |
          if git diff --quiet -- assets/search/index.json; then
            echo "Search index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/search/index.json
          git commit -m "Rebuild search index"
          git push
