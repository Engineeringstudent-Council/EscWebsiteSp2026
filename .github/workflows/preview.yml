name: Preview deploy

# Deploys every PR to its own Cloudflare Pages preview URL and comments the
# link on the PR. Pushes to main refresh the stable preview at
# https://esc-berkeley.pages.dev (a mirror for reviewing, not the real site,
# which is still served by OCF at esc.studentorg.berkeley.edu).
#
# One-time setup (repo admin): add the secrets CLOUDFLARE_API_TOKEN (a token
# with "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID. Until then this
# workflow skips itself instead of failing.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Preview deploys are off. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable them."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - name: Stage the public site
        if: env.HAS_TOKEN == 'true'
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude 'node_modules' \
            --exclude 'tests' --exclude 'scripts' --exclude 'docs' --exclude '_site' \
            --exclude '*.zip' --exclude '*.php' --exclude 'package*.json' \
            --exclude '*.config.*' --exclude 'lighthouserc.json' --exclude '.*'
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=esc-berkeley --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
      - name: Comment the preview URL
        if: env.HAS_TOKEN == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          body="🔎 **Preview:** $URL

          Built from ${{ github.event.pull_request.head.sha }}."
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "$body" \
            || gh pr comment ${{ github.event.pull_request.number }} --body "$body"
