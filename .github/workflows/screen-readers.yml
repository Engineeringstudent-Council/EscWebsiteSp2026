name: Screen readers

# Real VoiceOver (macOS) and NVDA (Windows) walk the site navigation. These
# runs are slower and noisier than the main CI, so they run when the nav
# changes, weekly, and on demand rather than on every PR.
on:
  pull_request:
    paths:
      - 'assets/js/site/nav-a11y.js'
      - 'assets/js/top-bar.js'
      - 'assets/js/main.js'
      - 'tests/screenreader/**'
      - 'playwright.screenreader.config.mjs'
      - '.github/workflows/screen-readers.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/site/nav-a11y.js'
      - 'assets/js/top-bar.js'
      - 'tests/screenreader/**'
  schedule:
    - cron: '0 15 * * 1' # Mondays, 8am Pacific
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-readers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voiceover:
    name: VoiceOver (macOS, Safari engine)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare macOS for VoiceOver automation
        uses: guidepup/setup-action@0.21.0
        with:
          record: true
      - run: npx playwright install webkit
      - run: npx playwright test -c playwright.screenreader.config.mjs --project=voiceover
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: voiceover-results
          path: |
            playwright-report/
            test-results/
            recordings/
          retention-days: 14

  nvda:
    name: NVDA (Windows, Chrome engine)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare Windows for NVDA automation
        uses: guidepup/setup-action@0.21.0
        with:
          record: true
      - run: npx playwright install chromium
      - run: npx playwright test -c playwright.screenreader.config.mjs --project=nvda
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nvda-results
          path: |
            playwright-report/
            test-results/
            recordings/
          retention-days: 14
