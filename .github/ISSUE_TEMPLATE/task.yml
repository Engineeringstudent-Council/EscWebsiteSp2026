name: Committee task
description: A piece of work from a tech meeting.
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner (GitHub handle)
  - type: input
    id: estimate
    attributes:
      label: Estimated hours
