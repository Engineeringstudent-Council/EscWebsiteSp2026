	<body class="is-preload">
		<script src="assets/js/top-bar.js"></script>
		<div id="page-wrapper">
			<!-- Main -->
				<main id="main" class="wrapper style1">
					<div class="container">
						<header class="major calendar-heading">
							<br>
							<p class="calendar-eyebrow">ENGINEERING STUDENT COUNCIL</p>
							<h1>Events Calendar</h1>
							<p>Find your next way to connect, learn, and build with the engineering community.</p>
						</header>

						<section class="calendar-preview" aria-label="Events calendar preview">
							<div class="calendar-notice" role="note">
								<span class="calendar-notice-dot" aria-hidden="true"></span>
								<span><strong>Calendar preview</strong> &mdash; sample events only; a live event feed is not connected yet.</span>
							</div>

							<div class="calendar-toolbar">
								<div class="calendar-month-controls">
									<button class="calendar-today" id="calendar-today" type="button">Today</button>
									<div class="calendar-arrows" aria-label="Change month">
										<button id="calendar-previous" type="button" aria-label="Previous month">&lsaquo;</button>
										<button id="calendar-next" type="button" aria-label="Next month">&rsaquo;</button>
									</div>
									<h2 id="calendar-month" aria-live="polite"></h2>
								</div>
								<div class="calendar-filters" role="group" aria-label="Filter sample events">
									<button class="is-active" type="button" data-calendar-filter="all" aria-pressed="true">All events</button>
									<button type="button" data-calendar-filter="workshop" aria-pressed="false">Workshops</button>
									<button type="button" data-calendar-filter="community" aria-pressed="false">Community</button>
									<button type="button" data-calendar-filter="professional" aria-pressed="false">Professional</button>
								</div>
							</div>

							<div class="calendar-layout">
								<div class="calendar-month-view">
									<div class="calendar-weekdays" aria-hidden="true">
										<span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
									</div>
									<div class="calendar-days" id="calendar-days" aria-label="Calendar dates"></div>
									<div class="calendar-legend"><span aria-hidden="true"></span> Sample event</div>
								</div>

								<aside class="calendar-agenda" aria-label="Events for selected date">
									<p class="calendar-agenda-eyebrow">YOUR DAY</p>
									<h3 id="calendar-selected-date"></h3>
									<div id="calendar-day-events" aria-live="polite"></div>
									<div class="calendar-upcoming">
										<h4>Coming up this month</h4>
										<div id="calendar-upcoming-events"></div>
									</div>
								</aside>
							</div>
					</div>
				</main>

			<!-- Footer -->
			<script src="assets/js/bottom-bar.js"></script>
		</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.scrolly.min.js"></script>

			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

			<script type="module" src="assets/js/search/ui.js"></script>
			<script type="module" src="assets/js/site/enhance.js"></script>
			<script src="assets/js/calendar.js"></script>
	</body>
