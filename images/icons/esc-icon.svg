<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ESC app icon: the logo's Newton's cradle on Berkeley Blue.
       Full-bleed background with the mark inside the central 80% so it
       also works as a maskable icon (circles, squircles, rounded squares). -->
  <rect width="512" height="512" fill="#002676"/>
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round">
    <line x1="120" y1="168" x2="392" y2="168"/>
    <line x1="160" y1="168" x2="160" y2="292"/>
    <line x1="216" y1="168" x2="216" y2="292"/>
    <line x1="272" y1="168" x2="272" y2="292"/>
  </g>
  <line x1="328" y1="168" x2="372" y2="284" stroke="#FDB515" stroke-width="12" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="160" cy="318" r="27"/>
    <circle cx="216" cy="318" r="27"/>
    <circle cx="272" cy="318" r="27"/>
  </g>
  <circle cx="382" cy="310" r="27" fill="#FDB515"/>
</svg>
